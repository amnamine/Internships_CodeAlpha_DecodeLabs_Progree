<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumCalc - The Ultimate Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Link CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="calculator-container">
        <!-- Theme & Utility Header -->
        <header class="calc-header">
            <div class="brand">
                <span class="logo-dot"></span>
                <h1>QuantumCalc</h1>
            </div>
            
            <div class="utility-actions">
                <!-- Theme Switcher -->
                <div class="theme-selector" id="themeSelectorBtn" title="Change Theme">
                    <div class="theme-option aurora active" data-theme="aurora">
                        <span class="theme-dot"></span>
                    </div>
                    <div class="theme-option solar" data-theme="solar">
                        <span class="theme-dot"></span>
                    </div>
                    <div class="theme-option cyberpunk" data-theme="cyberpunk">
                        <span class="theme-dot"></span>
                    </div>
                </div>

                <!-- History Toggle -->
                <button class="icon-btn" id="historyToggleBtn" title="Calculation History" aria-label="Toggle calculation history">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </button>

                <!-- Scientific Mode Toggle -->
                <button class="icon-btn" id="sciToggleBtn" title="Toggle Scientific Mode" aria-label="Toggle scientific mode">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="9" x2="20" y2="9"></line>
                        <line x1="4" y1="15" x2="20" y2="15"></line>
                        <line x1="10" y1="3" x2="14" y2="21"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Display Screen -->
        <section class="calc-display-section" id="calcDisplaySection">
            <div class="display-wrapper">
                <div class="display-expr" id="displayExpr" aria-live="polite"></div>
                <div class="display-input-container">
                    <span class="display-cursor" id="displayCursor"></span>
                    <div class="display-input" id="displayInput">0</div>
                </div>
            </div>
        </section>

        <!-- Main Buttons Interface -->
        <main class="calc-buttons-area">
            <!-- Scientific Operations Subgrid -->
            <div class="scientific-panel collapsed" id="scientificPanel">
                <button class="btn btn-sci" data-action="sin" title="Sine">sin</button>
                <button class="btn btn-sci" data-action="cos" title="Cosine">cos</button>
                <button class="btn btn-sci" data-action="tan" title="Tangent">tan</button>
                <button class="btn btn-sci" data-val="pi" title="Pi (π)">π</button>
                
                <button class="btn btn-sci" data-action="log" title="Logarithm base 10">log</button>
                <button class="btn btn-sci" data-action="ln" title="Natural Logarithm">ln</button>
                <button class="btn btn-sci" data-action="sqrt" title="Square Root">√</button>
                <button class="btn btn-sci" data-val="e" title="Euler's Constant (e)">e</button>
                
                <button class="btn btn-sci" data-action="power" title="Exponent (x^y)">x<sup>y</sup></button>
                <button class="btn btn-sci" data-action="factorial" title="Factorial (!)">x!</button>
                <button class="btn btn-sci" data-val="(" title="Open Parenthesis">(</button>
                <button class="btn btn-sci" data-val=")" title="Close Parenthesis">)</button>
            </div>

            <!-- Standard Keypad -->
            <div class="standard-panel">
                <!-- Row 1: Commands -->
                <button class="btn btn-cmd" id="btn-ac" data-action="clear" title="All Clear">AC</button>
                <button class="btn btn-cmd" id="btn-back" data-action="backspace" title="Delete Last Symbol">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
                <button class="btn btn-cmd" data-val="%" title="Percentage">%</button>
                <button class="btn btn-op" data-val="/" title="Divide">÷</button>

                <!-- Row 2: 7, 8, 9, * -->
                <button class="btn btn-num" data-val="7">7</button>
                <button class="btn btn-num" data-val="8">8</button>
                <button class="btn btn-num" data-val="9">9</button>
                <button class="btn btn-op" data-val="*" title="Multiply">×</button>

                <!-- Row 3: 4, 5, 6, - -->
                <button class="btn btn-num" data-val="4">4</button>
                <button class="btn btn-num" data-val="5">5</button>
                <button class="btn btn-num" data-val="6">6</button>
                <button class="btn btn-op" data-val="-" title="Minus">−</button>

                <!-- Row 4: 1, 2, 3, + -->
                <button class="btn btn-num" data-val="1">1</button>
                <button class="btn btn-num" data-val="2">2</button>
                <button class="btn btn-num" data-val="3">3</button>
                <button class="btn btn-op" data-val="+" title="Plus">+</button>

                <!-- Row 5: 0, ., = -->
                <button class="btn btn-num btn-zero" data-val="0">0</button>
                <button class="btn btn-num" data-val=".">.</button>
                <button class="btn btn-equals" id="btn-equals" data-action="calculate" title="Calculate Result">=</button>
            </div>
        </main>
    </div>

    <!-- Slide-out History Panel -->
    <aside class="history-drawer" id="historyDrawer" aria-hidden="true">
        <div class="history-header">
            <h2>History</h2>
            <button class="icon-btn close-btn" id="historyCloseBtn" title="Close Drawer" aria-label="Close history drawer">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="history-content" id="historyContent">
            <!-- Dynamically populated calculation logs -->
            <p class="no-history-msg">No recent calculations</p>
        </div>
        <div class="history-footer">
            <button class="btn-clear-history" id="clearHistoryBtn">Clear History</button>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
