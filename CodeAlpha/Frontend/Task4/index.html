<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Premium Music Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Player Section -->
        <main class="player-card">
            <!-- Header -->
            <header class="player-header">
                <div class="brand">
                    <i data-lucide="music" class="brand-icon"></i>
                    <span>AURA</span>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="player">Player</button>
                    <button class="tab-btn" data-tab="visualizer">Visualizer</button>
                </div>
            </header>

            <!-- Screen View: Standard Player -->
            <div class="screen-view active" id="player-view">
                <!-- Cover Art Vinyl/CD Wrapper -->
                <div class="cover-wrapper">
                    <div class="vinyl-disk" id="vinyl-disk">
                        <img src="assets/synthwave.png" alt="Album Cover" class="album-cover" id="album-cover">
                        <div class="vinyl-center"></div>
                    </div>
                </div>

                <!-- Song Info -->
                <div class="song-info">
                    <h1 class="song-title" id="song-title">Select a song</h1>
                    <p class="song-artist" id="song-artist">Artist Name</p>
                </div>
            </div>

            <!-- Screen View: Web Audio Visualizer -->
            <div class="screen-view" id="visualizer-view">
                <div class="visualizer-container">
                    <canvas id="visualizer-canvas"></canvas>
                    <div class="visualizer-overlay">
                        <p class="visualizer-status">Play a track to start the visualizer</p>
                    </div>
                </div>
            </div>

            <!-- Audio Controls (Always visible) -->
            <div class="controls-wrapper">
                <!-- Progress Bar -->
                <div class="progress-container">
                    <span class="time-stamp" id="current-time">0:00</span>
                    <div class="progress-bar-outer" id="progress-bar-outer">
                        <div class="progress-bar-inner" id="progress-bar-inner"></div>
                        <div class="progress-handle" id="progress-handle"></div>
                    </div>
                    <span class="time-stamp" id="total-duration">0:00</span>
                </div>

                <!-- Audio control buttons -->
                <div class="control-buttons">
                    <button class="btn btn-secondary" id="btn-shuffle" title="Shuffle">
                        <i data-lucide="shuffle"></i>
                    </button>
                    <button class="btn btn-primary-outline" id="btn-prev" title="Previous">
                        <i data-lucide="skip-back"></i>
                    </button>
                    <button class="btn btn-play" id="btn-play-pause" title="Play">
                        <i data-lucide="play" id="play-icon"></i>
                    </button>
                    <button class="btn btn-primary-outline" id="btn-next" title="Next">
                        <i data-lucide="skip-forward"></i>
                    </button>
                    <button class="btn btn-secondary" id="btn-repeat" title="Repeat">
                        <i data-lucide="repeat"></i>
                    </button>
                </div>

                <!-- Volume and Actions footer -->
                <div class="controls-footer">
                    <div class="volume-container">
                        <button class="btn-icon" id="btn-volume" title="Mute/Unmute">
                            <i data-lucide="volume-2" id="volume-icon"></i>
                        </button>
                        <div class="volume-slider-outer" id="volume-slider-outer">
                            <div class="volume-slider-inner" id="volume-slider-inner" style="width: 80%;"></div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-icon" id="btn-favorite" title="Like Song">
                            <i data-lucide="heart" class="heart-icon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Playlist Sidebar -->
        <aside class="playlist-sidebar">
            <div class="sidebar-header">
                <h2>Tracklist</h2>
                <span class="track-count" id="track-count">0 tracks</span>
            </div>
            
            <!-- Search bar -->
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="playlist-search" placeholder="Search track, artist...">
            </div>

            <!-- List of tracks -->
            <div class="tracks-list" id="tracks-list">
                <!-- Dynamically populated in JavaScript -->
            </div>
        </aside>
    </div>

    <!-- HTML Audio Element -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script src="script.js"></script>
</body>
</html>
