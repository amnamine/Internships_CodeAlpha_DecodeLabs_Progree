{% extends 'board/base.html' %}

{% block title %}Login - CareerPulse{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to manage your listings or track applications</p>
        
        <form method="POST" action="{% url 'login' %}" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="input-field" required placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="input-field" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">
                <i data-lucide="log-in"></i> Sign In
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--color-primary); font-weight: 600;">Sign up free</a>
        </p>
    </div>
</div>
{% endblock %}
