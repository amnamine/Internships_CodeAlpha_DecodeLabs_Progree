<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoLink | Premium URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
</head>
<body>
    <div class="background-decor">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <main class="container">
        <header class="app-header">
            <div class="logo">
                <span class="icon">🔗</span>
                <h1 class="logo-text">Nano<span>Link</span></h1>
            </div>
            <p class="subtitle">Beautiful, fast, and analytical URL shortening service</p>
        </header>

        <section class="shortener-card">
            <form id="shortenForm" class="shorten-form">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="longUrl" 
                        placeholder="Paste your long URL here (e.g., https://example.com/very/long/path)" 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="btn-submit">
                        <span class="btn-text">Shorten</span>
                        <span class="btn-loader"></span>
                    </button>
                </div>
            </form>

            <div id="resultCard" class="result-card hidden">
                <div class="result-header">
                    <h3>Your shortened link is ready!</h3>
                </div>
                <div class="result-body">
                    <input type="text" id="shortenedUrl" readonly>
                    <button id="copyBtn" class="btn-copy">
                        <span class="copy-icon">📋</span> Copy
                    </button>
                </div>
            </div>
        </section>

        <section class="analytics-section">
            <div class="section-header">
                <h2>📊 Link Analytics & History</h2>
                <button id="refreshBtn" class="btn-refresh">🔄 Refresh</button>
            </div>
            <div class="table-container">
                <table class="analytics-table">
                    <thead>
                        <tr>
                            <th>Original Link</th>
                            <th>Short Link</th>
                            <th>Created At</th>
                            <th>Clicks</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="analyticsBody">
                        <tr>
                            <td colspan="5" class="empty-state">No links shortened yet. Create one above!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 NanoLink. Made with ❤️ and premium styling.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
